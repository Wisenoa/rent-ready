# ==============================================================================
# Lokna Production Docker Compose Stack
# Fully isolated from Facturama and all other host services
# ==============================================================================
name: lokna

services:
  # ============================================================================
  # Dedicated PostgreSQL 16 Database
  # - Accessible ONLY inside lokna_internal network
  # - NO exposed host ports
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: lokna-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lokna_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - lokna_postgres_data:/var/lib/postgresql/data
    networks:
      - lokna_internal
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-lokna_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Dedicated Prisma Migrator (Init-Container)
  # - Runs 'prisma migrate deploy' strictly BEFORE 'app' starts
  # - If migration fails, 'app' never starts
  # ============================================================================
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: lokna-migrator
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@lokna-postgres:5432/${POSTGRES_DB:-lokna_production}?schema=public
    networks:
      - lokna_internal

  # ============================================================================
  # Lokna Next.js Application (Standalone Runner)
  # - Runs as unprivileged 'nextjs' user (UID 1001)
  # - Starts ONLY after migrator completes successfully
  # - Internal port 3000 mapped to Docker gateway 172.17.0.1:3019
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://lokna.fr}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://lokna.fr}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: lokna-app
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@lokna-postgres:5432/${POSTGRES_DB:-lokna_production}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://lokna.fr}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://lokna.fr}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://lokna.fr}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_STARTER_MONTHLY_PRICE_ID: ${STRIPE_STARTER_MONTHLY_PRICE_ID:-}
      STRIPE_STARTER_ANNUAL_PRICE_ID: ${STRIPE_STARTER_ANNUAL_PRICE_ID:-}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${STRIPE_PRO_MONTHLY_PRICE_ID:-}
      STRIPE_PRO_ANNUAL_PRICE_ID: ${STRIPE_PRO_ANNUAL_PRICE_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_DOMAIN: ${RESEND_DOMAIN:-lokna.fr}
      CRON_SECRET: ${CRON_SECRET:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_PORT: ${MINIO_PORT:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
    ports:
      # Bound to Docker bridge gateway 172.17.0.1 on port 3019
      # This allows Caddy (via host.docker.internal:3019) to reach the app
      # while keeping it strictly inaccessible from the public internet interface
      - "172.17.0.1:3019:3000"
    networks:
      - lokna_internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  lokna_postgres_data:
    name: lokna_postgres_data

networks:
  lokna_internal:
    name: lokna_internal
    driver: bridge
