name: CI

# Deliberately small. Previous pipelines were deleted three times for cost, and
# duplicated `pnpm install` across every job. This runs one install, then the
# gates that actually protect the golden path:
#
#   Property -> Tenant -> Lease -> Rent -> Payment -> Receipt
#
# The runtime scripts under scripts/verify-*.py exercise that path against a real
# Postgres. They are the reason this file exists: the golden path was broken for
# months and every existing check passed anyway.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # The verification scripts need a reachable database; migrations must succeed
  # from an empty database, which is exactly what the shipped migrations were
  # failing to do.
  DATABASE_URL: postgresql://rentready:rentready@localhost:5432/rentready?schema=public
  # Present so `import { Resend } from "resend"` resolves at build time. No email
  # is sent in CI; see src/lib/email.ts, which throws only when a send is
  # actually attempted.
  RESEND_API_KEY: re_ci_placeholder
  BETTER_AUTH_SECRET: ci-secret-not-used-for-assertions
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Lint, types, tests, build, golden path
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rentready
          POSTGRES_PASSWORD: rentready
          POSTGRES_DB: rentready
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # No postinstall: it only runs `prisma generate`, which needs no database
      # and is covered by the migrate step's own generate.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Prisma generate
        run: pnpm prisma generate

      # Fails loudly if the migration chain cannot build a schema from nothing.
      # This is the check that would have caught StripeWebhookEvent being created
      # twice and Conversation/Message/UserProductPurchase having no migration.
      - name: Migrate from an empty database
        run: pnpm prisma migrate deploy

      - name: Lint
        run: pnpm lint

      # `next build` sets ignoreBuildErrors, so type errors are invisible unless
      # checked separately.
      #
      # 16 errors are pre-existing, concentrated in portal-actions.tsx, analytics.ts
      # and the email templates.
      #
      # No error involves Decimal any more. Money is Decimal throughout and is
      # converted exactly once, at a boundary that genuinely needs a number: a
      # JSON DTO, an RSC prop, an AI prompt, an email template. That class of
      # error had been hiding real bugs — the quittance PDF, two dashboard pages
      # and the transactions dashboard all did arithmetic with `+`/`+=` on
      # Decimals, which concatenates ("700" + "40.50" = "70040.5", and
      # reduce(..., 0) rendered a property total as "0740.5300.25"). tsc reported
      # every one of them and `next build` discarded the report.
      #
      # A missing Prisma relation is invisible to tsc here — the row type widens and
      # the error only appears at runtime, which is how both /api/reminders routes
      # returned 500. reminder-lease-relation.test.ts pins that invariant instead.
      #
      # Note the trap this ratchet cannot see: changing a declared type to Decimal
      # while leaving the initialiser as 0 type-checks perfectly and still throws
      # "totalCollected.plus is not a function" at runtime. The runtime checks
      # below are what caught that.
      # A gate that always fails trains everyone to ignore red, so instead this
      # BLOCKS ON REGRESSION: the count may go down, never up. Lower `max` as debt
      # is cleared; the gate tightens on its own with no further change.
      # The Decimal-vs-number class (TS2322 on Prisma Decimal reaching a component
      # or a `number` parameter) is the dangerous one and is what this is watching.
      - name: Type check (blocks on regression)
        run: |
          pnpm tsc --noEmit > /tmp/tsc.log 2>&1 || true
          count=$(grep -c 'error TS' /tmp/tsc.log || true)
          max=16
          echo "TypeScript errors: $count (baseline $max)"
          if [ "$count" -gt "$max" ]; then
            echo "::error title=Type errors::$count errors, up from the $max baseline. No new type debt."
            grep 'error TS' /tmp/tsc.log | head -20
            exit 1
          fi
          if [ "$count" -gt 0 ]; then
            echo "::warning title=Type errors::$count pre-existing errors remain; budget $max."
            grep 'error TS' /tmp/tsc.log | head -20
          fi

      - name: Unit tests
        run: pnpm test

      # articles-meta.ts is generated from articles.ts, and the test above only
      # compares their counts. Deleting or adding an article without regenerating
      # it fails the suite with an opaque "expected 124, received 123" instead of
      # naming the cause, so check it directly and say what to run.
      - name: Article metadata is in sync
        run: |
          set +e
          pnpm gen:article-meta > /tmp/gen.log 2>&1
          if ! git diff --quiet -- src/data/articles-meta.ts; then
            echo "::error file=src/data/articles-meta.ts::Out of sync with articles.ts. Run 'pnpm gen:article-meta' and commit the result."
            git diff --stat -- src/data/articles-meta.ts
            exit 1
          fi
          echo "in sync"

      - name: Build
        run: pnpm build

      # `next build` loads every page module to collect page data. Anything that
      # throws at import time kills the build — and the message names whichever
      # page's worker lost the race first, so the same underlying cause surfaces
      # as /billing, /expenses, /_document, /login, /_not-found or /tenants on
      # different runs. Two causes were confirmed here:
      #
      #   1. DATABASE_URL unset -> src/lib/prisma.ts:11 throws on import.
      #      Fixed for CI by the env block above; do not drop those vars.
      #   2. Authenticated dashboard routes were being prerendered. The layout
      #      calls SubscriptionGate, which reads the session cookie, so building
      #      raised "Headers is required" from better-auth. Fixed in
      #      src/app/(dashboard)/layout.tsx with `dynamic = "force-dynamic"`.
      #
      # If this step fails, read the page name in the error as a symptom, not a
      # cause: the real fault is a module that throws during collection.

      # Exercises the golden path end to end against the live server, including
      # cross-tenant isolation. Each script exits non-zero on failure.
      - name: Start the app
        run: pnpm start &
        env:
          PORT: '3111'

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3111/login || true)
            if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "app did not become ready"
          exit 1

      - name: Golden path and tenant isolation
        run: python3 scripts/smoke-golden-path.py

      - name: Rent periods are generated and settled in place
        run: python3 scripts/verify-rent-generation.py

      - name: Arrears are visible to the landlord
        run: python3 scripts/verify-arrears-visible.py

      - name: Receipts are real, downloadable PDFs
        run: python3 scripts/verify-receipt.py

      # A period settled in instalments must still produce a quittance on the
      # payment that completes it. This was a legal-compliance bug: the receipt
      # type was decided from one payment's amount, so a tenant paying rent in
      # two parts could never obtain a quittance.
      - name: A period paid in instalments still yields a quittance
        run: python3 scripts/verify-receipt-cumulative.py

      # The period-level PAID status, through the API that creates a row per
      # payment. Before this was centralised, four write paths each judged
      # settlement from a single payment's amount, so a period paid in instalments
      # stayed PARTIAL forever and every arrears figure counted it as still owed.
      - name: A period paid in instalments still reaches PAID
        run: python3 scripts/verify-period-settlement.py

      # The tenant portal's only credential is its access token. This asserts that
      # authorisation is bound to the token presented, not to a bare tenantId that
      # any caller could supply to a server action.
      - name: Portal authorisation is bound to the presented token
        run: python3 scripts/verify-portal-token.py

      - name: Dashboard money is exact
        run: python3 scripts/verify-dashboard-money.py

      - name: Shots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-on-failure
          path: |
            .next/**/*.log
          retention-days: 7
          if-no-files-found: ignore